# ACESHRUG - Apache + mod_php
# Kopirati u /etc/apache2/conf-available/, prilagoditi putanje, pa:
#   sudo a2enconf aceshrug-app && sudo apache2ctl configtest && sudo systemctl reload apache2
# Iskljucivanje:
#   sudo a2disconf aceshrug-app && sudo systemctl reload apache2
#
# php_admin_value (ne php_value): aplikacija i .htaccess ne mogu da pregaze podesavanje.

# Signali gate-a idu u fajl iz --log-file (npr. /var/log/aceshrug/app.log).
# Greške aplikacije ostaju u standardnom Apache error logu.
<Directory /var/www/html/app>
    php_admin_value auto_prepend_file /etc/aceshrug/app/gate.php
</Directory>
